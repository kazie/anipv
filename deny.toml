# cargo-deny: https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# anipv itself is unlicensed (all rights reserved); only dependencies are checked.
private = { ignore = true }
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]

[bans]
# Duplicate versions come from dependencies (ratatui, rusqlite, …) and go away as
# they update; nothing to act on here.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
