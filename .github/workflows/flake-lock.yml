name: Update flake.lock

# Once a week, updates flake.lock (nixpkgs and rust-overlay), checks the flake
# with it and opens a pull request, as Dependabot does for crates and actions.
# A lock that fails the checks never becomes one. A pull request opened with
# GITHUB_TOKEN doesn't start CI, so this dispatches CI on its branch for the
# checks master requires. Needs Settings → Actions → General → "Allow GitHub
# Actions to create and approve pull requests".
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: |
          { echo '```'; nix flake update 2>&1; echo '```'; } > "$RUNNER_TEMP/update.md"
      - run: nix flake check --all-systems
      - id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          branch: update-flake-lock
          title: "chore(deps): update flake.lock"
          commit-message: "chore(deps): update flake.lock"
          body-path: ${{ runner.temp }}/update.md
          add-paths: flake.lock
      - if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "${{ steps.pr.outputs.pull-request-branch }}"
        env:
          GH_TOKEN: ${{ github.token }}
